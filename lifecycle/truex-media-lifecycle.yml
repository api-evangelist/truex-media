  approach: >-
    true[X] practices additive, indefinitely-backward-compatible deprecation
    rather than publishing a policy. The JavaScript Ad API reference carries a
    dated deprecation table and states plainly: "The following config parameters
    and methods have been deprecated as of 6/2020. We will continue to support
    the deprecated params and methods so there is no need to update existing
    implementations." No removal date has ever been announced, and the wire
    still emits the deprecated parameter name — a live 400 from get.truex.com
    reads "partner_config_hash is missing" even though the current reference
    documents the parameter as placement.key.
