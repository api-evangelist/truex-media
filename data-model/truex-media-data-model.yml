  type: belongs_to
  via: campaign_id
id_conventions:
  numeric:
  - ad.id
  - campaign_id
  opaque_string:
  - placement_hash
  - session_id
  - engagement_id
  - request_id
  note: >-
    No typed id prefixes (no cus_/ch_ style namespacing). Numeric ids and opaque
    base64url-ish strings are mixed across the same payloads, and the same
    logical id is typed as integer in the ad object and as string in the
    callback payload (campaign_id, creative_id).
gaps:
- No object reference page; entities must be reconstructed from parameter tables.
- Inconsistent typing of the same id across surfaces (integer vs string).
- No read API for interactions, engagements or sessions — only aggregate reporting.
- No schema document (JSON Schema, OpenAPI components) of any kind.
