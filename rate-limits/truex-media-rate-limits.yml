implicit_controls:
  note: >-
    The provider does not throttle by request count, but it does publish two
    controls that bound consumption in practice.
  controls:
  - name: frequency caps
    detail: >-
      daily_frequency_cap and lifetime_frequency_cap are campaign-level fields
      returned in the Reporting API, capping how often a given user can be
      served a campaign. This is an ad-delivery control, not an API rate limit.
    source: https://github.com/socialvibe/truex-ads-docs/blob/master/reporting_api.md
  - name: callback IP allowlist
    detail: >-
      true[X] blocks all external calls to the engagement callback except from
      eight published egress addresses. An access control, not a rate limit.
    source: https://github.com/socialvibe/truex-ads-docs/blob/master/web_service_ad_api.md
  - name: reporting date range
    detail: >-
      start_date and end_date are the only lever bounding Reporting API response
      size; no maximum range is published.
