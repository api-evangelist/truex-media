note: >-
  HONEST ZERO. true[X] publishes no rate limits, quotas or throttling policy for
  either HTTP API, and no rate-limit signalling was observed on the wire. Every
  response header on both hosts was inspected: get.truex.com returns only
  caching, CORS and Set-Cookie headers plus a Server banner, and api.truex.com
  returns the standard Rails security-header set plus X-Request-Id and
  X-Runtime. There is no X-RateLimit-Limit, X-RateLimit-Remaining,
  X-RateLimit-Reset, RateLimit-* (RFC 9239 style) or Retry-After on either
  surface, and no 429 was reachable anonymously. An integrating agent therefore
  has no runtime signal at all — it cannot know its budget, its remaining
  allowance, or when to retry.
