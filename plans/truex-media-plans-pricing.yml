pricing_signals:
  note: >-
    The provider does not publish rates, but its own documentation names the
    units it bills in. These are the economic primitives, not prices.
  units:
  - name: engagement
    detail: >-
      The billing event. Created when a user meets True Attention — roughly 30
      seconds spent plus at least one interaction. "This is also known as the
      'billing event' because this is when the advertiser is billed and the
      publisher earns their per-unit payment."
    source: https://github.com/socialvibe/truex-ads-docs/blob/master/js_ad_api.md
  - name: average_cpe
    detail: >-
      Cost per engagement. Reported per placement/day/campaign in the Reporting
      API alongside advertiser_cost and net_revenue, so a publisher can read its
      realized economics — but the rate card itself is not published.
    source: https://github.com/socialvibe/truex-ads-docs/blob/master/reporting_api.md
  - name: revenue_amount
    detail: Per-ad revenue to the partner, returned on the ad object itself.
  - name: currency_amount / currency_label
    detail: >-
      Publisher-side virtual currency granted to the user for completing an ad,
      e.g. "2 Coins" — the reward side of the opt-in model.
  - name: cap_type
    values:
    - units
    - value_added_units
    detail: Distinguishes billable units from added-value inventory.
