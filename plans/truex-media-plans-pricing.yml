note: >-
  HONEST ZERO, NOT AN OMISSION. true[X] and Infillion publish no plans, no
  price list and no self-service tier. There is no /pricing page — the URL 404s
  — and no pricing appears in the sitemap, which was walked in full. The
  commercial motion is a media buy negotiated with a sales team: the Agent
  Connector product page is a "request a demo" form, the true[X] product page
  routes to Contact, and every credential in the developer documentation
  (placement key, application_key, application_secret, reporting api_key) is
  described as "provided by true[X]" during an integration phase. There is no
  signup, no free tier and no trial.
