  method: probed
  evidence:
    url: https://mcp.infillion.com/mcp
    http_status: 401
    fetched: '2026-08-12'
callback_response_codes:
  surface: server-to-server engagement callback (partner endpoint -> true[X])
  direction: >-
    These are the codes the PARTNER returns to true[X], not codes true[X]
    returns. They are the retry contract for engagement callbacks.
  codes:
  - code: 0
    meaning: Recoverable failure
    action: true[X] will retry the request.
  - code: 1
    meaning: Callback successfully processed
    action: No retry.
  - code: 2
    meaning: Invalid signature
    action: >-
      true[X] is notified for investigation. Indicates the HMAC-SHA1 sig did not
      validate against the partner's application_secret.
  - code: 3
    meaning: Invalid user or duplicate engagement_id
    action: >-
      The request will not be retried. This is the documented
      duplicate-suppression path that prevents over-crediting a user.
  source: https://github.com/socialvibe/truex-ads-docs/blob/master/web_service_ad_api.md
renderer_error_events:
  note: >-
    Client-side renderer failures do not surface as HTTP errors; they surface as
    terminal ad events the host application must handle. Both are documented as
    terminal — the host must resume its own video playback.
  events:
  - name: adError
    platforms:
    - web
    - roku
    - ios
    - tvos
    android_name: AD_ERROR
    ios_name: onAdError
    terminal: true
    payload: errorMessage
    handling: >-
      Treat as an exception, remove the ad container, and resume normal
      playback.
  - name: noAdsAvailable
    platforms:
    - web
    - roku
    - ios
    - tvos
    android_name: NO_ADS_AVAILABLE
    ios_name: onNoAdsAvailable
    terminal: true
    handling: Resume the normal ad break; no true[X] ad was returned.
  js_client_event: onError
  source: https://github.com/socialvibe/truex-ad-renderer-web-integration/blob/master/DOCS.md
gaps:
- No stable machine-readable error code or type URI on any response.
- No error registry page; errors must be discovered from live responses.
- The no-fill case is an HTTP 200 carrying an error key.
- Auth failure on the Reporting API is text/plain, not the JSON envelope used elsewhere.
- The wire error still names a parameter (partner_config_hash) the reference deprecated in 2020.
