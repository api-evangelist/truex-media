generated: '2026-08-12'
method: searched
source: >-
  https://github.com/socialvibe/truex-ads-docs (web_service_ad_api.md,
  reporting_api.md, js_ad_api.md) and the renderer references in
  truex-android-integrations, truex-roku-integrations and
  truex-ad-renderer-web-integration, plus live unauthenticated responses
  observed from get.truex.com and api.truex.com on 2026-08-12.
format: proprietary
rfc9457: false
note: >-
  true[X] publishes no error-code registry and no problem-details media type.
  This catalog is assembled from the error responses the provider documents,
  the responses observed live from its own hosts, and the terminal error events
  its renderers emit. Every entry is either quoted from the docs or from an
  observed response — none is inferred.
envelope:
  ad_api:
    content_type: application/json
    fields:
      error: Human-readable error string.
      request_id: Opaque per-request identifier.
      fillable: Boolean; present on no-fill responses.
  reporting_api:
    content_type: text/plain
    note: >-
      The Reporting API does not use a JSON envelope for auth failures; it
      returns a plain-text body.
errors:
