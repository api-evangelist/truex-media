- id: mcp-missing-authorization
  api: infillion-agent-connector-mcp
  status: 401
  body: '{"error": "Missing Authorization header"}'
  title: MCP request unauthenticated
  cause: >-
    A request reached the Infillion Agent Connector gateway without a bearer
    token.
  remediation: >-
    Complete the OAuth 2.1 authorization-code + PKCE flow advertised at
    https://mcp.infillion.com/.well-known/oauth-authorization-server and retry
