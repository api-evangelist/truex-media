  api: truex-media-web-service-ad-api
  status: 400
  body: '{"error":"partner_config_hash is missing","request_id":"..."}'
  title: Placement key missing
  cause: >-
    The request omitted the required placement identifier. Note the wire error
    still names the deprecated parameter partner_config_hash even though the
    current reference documents the parameter as placement.key.
  remediation: Send placement.key with the placement identifier issued by true[X].
  method: probed
  evidence:
    url: https://get.truex.com/v2
    http_status: 400
    fetched: '2026-08-12'
- id: no-bid-found
  api: truex-media-web-service-ad-api
  status: 200
  body: '{"error":"No bid found","fillable":false,"request_id":"..."}'
  title: No ad available
  cause: >-
    No true[X] ad is available for this user and placement. Documented in the
    reference as the expected empty result — '{"error": "No bid found"}' — and
    it is returned with HTTP 200, not an error status.
  remediation: >-
    Treat as a normal no-fill. Do not show a trigger point; waterfall to the
    next ad source. Branch on the presence of the error key, not on the status
    code.
  method: probed
  evidence:
    url: https://get.truex.com/v2?placement.key=<invalid>&user.id=<test>
    http_status: 200
    fetched: '2026-08-12'
