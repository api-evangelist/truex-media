apis:
- aid: truex-media-web-service-ad-api
  name: true[X] Web Service Ad API
  description: >-
    Server-side ad request API. A GET against the versioned endpoint with a
    placement key, user id, IP and user agent returns a JSON `ad` object
    (creative id, campaign id, window URL and dimensions, currency amount,
    revenue amount, session id) or an error object when no bid is available.
    Intended for server-side implementations; the returned ad object can be
    handed to the true[X] JavaScript client via `prepareAd` for client-side
    event handling. Pairs with a signed server-to-server engagement callback.
  humanURL: https://github.com/socialvibe/truex-ads-docs/blob/master/web_service_ad_api.md
  baseURL: https://get.truex.com/v2
  tags:
  - Ad Serving
  - Advertising
  - Video Advertising
  properties:
  - type: Documentation
    url: https://github.com/socialvibe/truex-ads-docs/blob/master/web_service_ad_api.md
  - type: APIReference
    url: https://github.com/socialvibe/truex-ads-docs/blob/master/web_service_ad_api.md
- aid: truex-media-reporting-api
  name: true[X] Reporting API
  description: >-
    Publisher performance reporting. A GET against
    /v1/publisher/performance.json (or .csv) with an api_key and a date range
    returns revenue and key performance indicators broken out by placement key,
    day and campaign — including initial and completed engagements, advertiser
    cost, average CPE, net revenue, frequency caps and geo targeting.
  humanURL: https://github.com/socialvibe/truex-ads-docs/blob/master/reporting_api.md
  baseURL: https://api.truex.com/v1
  tags:
  - Reporting
  - Analytics
  - Advertising
  properties:
  - type: Documentation
    url: https://github.com/socialvibe/truex-ads-docs/blob/master/reporting_api.md
  - type: APIReference
    url: https://github.com/socialvibe/truex-ads-docs/blob/master/reporting_api.md
- aid: truex-media-js-ad-api
  name: true[X] JavaScript Ad API
  description: >-
    Client-side JavaScript integration for publishers embedding true[X]
    engagement ads on the web. Loads truex.client from static.truex.com, exposes
    requestAd, loadAdIntoContainer, openAdWindow, trackTriggerPointImpression,
    trackOptOut and prepareAd, and emits the ad lifecycle events onStart,
    onCredit, onClose, onFinish, onMessage, onError and onClickthrough.
  humanURL: https://github.com/socialvibe/truex-ads-docs/blob/master/js_ad_api.md
  baseURL: https://static.truex.com/js/client.js
  tags:
  - Advertising
