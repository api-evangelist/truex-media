name: Truex Media
description: >-
  TrueX (stylized true[X]) is an interactive, opt-in video advertising company
  now operating as part of Infillion. Its technology delivers "attention-based"
  ad experiences — Choice Cards and interactive engagement units that let
  viewers opt in to a single, longer branded interaction in exchange for an
  ad-free content break — across connected TV (CTV), over-the-top (OTT), mobile,
  and web. The company originated as SocialVibe (a Redpoint Ventures portfolio
  company), was acquired by 21st Century Fox, and is now a video advertising
  product within Infillion alongside MediaMath, InStadium, Gimbal, and Catalina.
  true[X] publishes two real HTTP APIs from its own truex.com hosts — a Web
  Service Ad API at get.truex.com/v2 that returns a JSON ad object for
  server-side ad requests, and a Reporting API at api.truex.com/v1 that returns
  publisher performance by placement, day and campaign — alongside a signed
  server-to-server engagement callback. Its primary integration surface remains
  the TruexAdRenderer (TAR) client SDK, published first-party from the
  "socialvibe" GitHub organization and the @truex npm scope for iOS, tvOS,
  Android/Fire TV, Roku, Amazon Vega OS, and CTV/HTML5 web. Parent company
  Infillion also operates Infillion Agent Connector, an MCP-based agent-native
  media execution layer at mcp.infillion.com.
