name: Truex Media
description: >-
  TrueX (stylized true[X]) is an interactive, opt-in video advertising company
  now operating as part of Infillion. Its technology delivers "attention-based"
  ad experiences — Choice Cards and interactive engagement units that let
  viewers opt in to a single, longer branded interaction in exchange for an
  ad-free content break — across connected TV (CTV), over-the-top (OTT), mobile,
  and web. The company originated as SocialVibe (a Redpoint Ventures portfolio
  company), was acquired by 21st Century Fox, and is now a video advertising
  product within Infillion alongside MediaMath, InStadium, Gimbal, and Catalina.
  TrueX's integration surface is the TruexAdRenderer (TAR) client SDK — published
  first-party from the "socialvibe" GitHub organization for iOS, tvOS, Android,
  Roku, and CTV/HTML5 web via Swift Package Manager and CocoaPods — rather than a
  public REST API. Publishers embed the renderer, typically alongside Google IMA
  (client- or server-side ad insertion), to serve and measure interactive ads.
