  reference: https://github.com/socialvibe/truex-ads-docs/blob/master/connected_device_vast_wrapper_query_args.md
gaps:
- No self-service test credential; every key comes from a human at true[X].
- No test-mode indicator on the credential itself.
- No QA host published for the Reporting API.
- No documented fixture that reliably returns a filled ad, so the happy path cannot be exercised without a live campaign.
